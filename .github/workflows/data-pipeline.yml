name: Data Pipeline

on:
  schedule:
    # Source cadence: ABS Retail Trade is published MONTHLY (~5 weeks after the
    # reference month). Monthly is the fastest cron the factory allows and it
    # matches the source. Staggered to the 9th at 04:23 UTC so repos don't all
    # fire together.
    - cron: '23 4 9 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
